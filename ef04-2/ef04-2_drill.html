<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="../gamba_support.js"></script>
<title>EF04-2 展開の置き換え 【演習】</title>
<style>
:root{--primary:#7e22ce;--primary-light:#f3e8ff;--accent:#e8372d;--accent-light:#fff1f0;--success:#16a34a;--success-light:#dcfce7;--warn:#d97706;--warn-light:#fffbeb;--bg:#faf5ff;--card:#ffffff;--border:#e9d5ff;--text:#1e293b;--text-sub:#64748b;--radius:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic','BIZ UDP Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}
.g-container{max-width:760px;margin:0 auto;padding:22px 15px 60px;}
.page-header{background:var(--primary);color:#fff;padding:16px 20px 12px;text-align:center;box-shadow:0 3px 10px rgba(126,34,206,.25);}
.page-header .unit-code{font-size:.8em;opacity:.8;letter-spacing:.1em;margin-bottom:3px;}
.page-header h1{font-size:clamp(.98em,3vw,1.38em);font-weight:700;margin:0;line-height:1.4;}
.step-nav{display:flex;align-items:center;justify-content:center;padding:9px 6px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:10;gap:1px;}
.step-item{display:flex;align-items:center;gap:3px;font-size:clamp(.62em,1.6vw,.78em);color:#94a3b8;white-space:nowrap;padding:2px 4px;}
.step-item a{color:inherit;text-decoration:none;}
.step-item a:hover{color:var(--primary);}
.step-item.active{color:var(--primary);font-weight:700;}
.step-circle{width:19px;height:19px;border-radius:50%;font-size:.68em;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-item.active .step-circle{background:var(--primary);color:#fff;}
.step-item:not(.active) .step-circle{background:#94a3b8;color:#fff;}
.step-arrow{color:#cbd5e1;font-size:.9em;padding:0;}
.instruction{background:var(--primary-light);border-left:4px solid var(--primary);border-radius:0 var(--radius) var(--radius) 0;padding:12px 15px;margin-bottom:18px;font-size:.93em;color:#7e22ce;line-height:1.7;}
.step-order{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.step-badge{background:var(--primary);color:#fff;border-radius:6px;padding:5px 12px;font-size:.84em;font-weight:700;}
.step-arrow2{color:var(--primary);font-weight:700;font-size:1.1em;}
.problem-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.problem-head{display:flex;align-items:center;padding:13px 15px;gap:10px;flex-wrap:wrap;font-weight:700;font-size:.97em;}
.p-badge{background:var(--primary);color:#fff;font-size:.72em;font-weight:700;border-radius:6px;padding:3px 9px;white-space:nowrap;flex-shrink:0;}
.ans-toggle{margin-left:auto;background:none;border:1.5px solid #94a3b8;border-radius:20px;padding:5px 13px;font-family:'BIZ UDPGothic',sans-serif;font-size:.78em;color:var(--text-sub);cursor:pointer;white-space:nowrap;touch-action:manipulation;}
.calc-row{display:flex;align-items:flex-start;gap:6px;padding:8px 11px;border-radius:8px;margin-bottom:5px;font-size:.86em;font-weight:700;line-height:2.1;}
.calc-row.y{background:var(--warn-light);border:1.5px solid var(--warn);}
.calc-row.b{background:var(--primary-light);border:1.5px solid var(--primary);}
.calc-row.g{background:var(--success-light);border:1.5px solid var(--success);}
.clbl{font-size:.68em;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap;flex-shrink:0;margin-top:3px;}
.clbl.y{background:var(--warn);color:#fff;}
.clbl.b{background:var(--primary);color:#fff;}
.clbl.g{background:var(--success);color:#fff;}
.nav-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:26px;}
.btn-nav{font-family:'BIZ UDPGothic','BIZ UDP Gothic',sans-serif;font-size:.93em;font-weight:700;padding:11px 24px;border-radius:50px;border:none;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s;}
.btn-nav:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn-f{background:var(--primary);color:#fff;}
.btn-b{background:#f1f5f9;color:var(--text-sub);}
.btn-h{background:#f3e8ff;color:#7e22ce;font-size:.83em;padding:9px 18px;}
</style>
</head>
<body>
<div class="page-header">
  <div class="unit-code">EF04-2</div>
  <h1>展開の置き換え<br><small style="font-size:.75em;opacity:.85;">演習</small></h1>
</div>
<nav class="step-nav">
  <div class="step-item"><span class="step-circle">①</span><a href="../ef01/intro.html">展開の基本</a></div>
  <span class="step-arrow">›</span>
  <div class="step-item"><span class="step-circle">②</span><a href="../ef02/intro.html">平方公式</a></div>
  <span class="step-arrow">›</span>
  <div class="step-item"><span class="step-circle">③</span><a href="../ef03/intro.html">和と差の積</a></div>
  <span class="step-arrow">›</span>
  <div class="step-item"><span class="step-circle">④</span><a href="../ef04-1/ef04-1_intro.html">組み合わせ展開</a></div>
  <span class="step-arrow">›</span>
  <div class="step-item active"><span class="step-circle">⑤</span><span>展開・置き換え</span></div>
  <span class="step-arrow">›</span>
  <div class="step-item"><span class="step-circle">⑥</span><a href="../ef05/intro.html">因数分解①</a></div>
</nav>
<nav class="step-nav" style="border-top:1px solid var(--border);">
  <div class="step-item"><span class="step-circle">①</span><a href="ef04-2_intro.html">導入</a></div>
  <span class="step-arrow">›</span>
  <div class="step-item"><span class="step-circle">②</span><a href="ef04-2_example.html">例題</a></div>
  <span class="step-arrow">›</span>
  <div class="step-item active"><span class="step-circle">③</span><span>演習</span></div>
  <span class="step-arrow">›</span>
  <div class="step-item"><span class="step-circle">④</span><a href="ef04-2_check.html">確認</a></div>
</nav>
<main class="g-container">
<div class="instruction"><strong>【演習】</strong>　自分で考えてから「答を見る」で確認しよう</div>
<div class="step-order">
  <span class="step-badge">① カタマリをAに置き換え</span>
  <span class="step-arrow2">→</span>
  <span class="step-badge">② 公式を使って展開</span>
  <span class="step-arrow2">→</span>
  <span class="step-badge">③ Aを元に戻す</span>
</div>
<div id="drill-area"></div>
<div class="nav-btns">
  <a href="../gamba_chugaku.html" class="btn-nav btn-h">🏠 単元一覧へ</a>
  <a href="ef04-2_example.html" class="btn-nav btn-b">← 例題</a>
  <a href="ef04-2_check.html" class="btn-nav btn-f">④ 確認テストへ →</a>
</div>
</main>
<script>
// example：(χ＋y＋3)(χ＋y－3), (χ＋y＋2)², (χ－1＋y)(χ－1－y), (a＋b＋c)(a＋b－c)
// drill(以下)：重複なし
const DRILLS=[
  {q:"(χ＋2＋y)(χ＋2－y)",ans:"χ²＋4χ＋4－y²",
    steps:[
      {cls:"y",lbl:"確認",txt:"「χ＋2」が同じカタマリ → A＝χ＋2"},
      {cls:"b",lbl:"公式③",txt:"(A＋y)(A－y)＝A²－y²"},
      {cls:"g",lbl:"戻す",txt:"(χ＋2)²－y²＝χ²＋4χ＋4－y²"},
    ]},
  {q:"(χ＋y－1)²",ans:"χ²＋2χy＋y²－2χ－2y＋1",
    steps:[
      {cls:"y",lbl:"確認",txt:"「χ＋y」を A とおく → (A－1)²"},
      {cls:"b",lbl:"公式②",txt:"A²－2A＋1"},
      {cls:"g",lbl:"戻す",txt:"(χ＋y)²－2(χ＋y)＋1＝χ²＋2χy＋y²－2χ－2y＋1"},
    ]},
  {q:"(a＋b＋1)(a＋b＋3)",ans:"a²＋2ab＋b²＋4a＋4b＋3",
    steps:[
      {cls:"y",lbl:"確認",txt:"「a＋b」が同じカタマリ → A＝a＋b"},
      {cls:"b",lbl:"公式①",txt:"(A＋1)(A＋3)＝A²＋4A＋3"},
      {cls:"g",lbl:"戻す",txt:"(a＋b)²＋4(a＋b)＋3＝a²＋2ab＋b²＋4a＋4b＋3"},
    ]},
  {q:"(χ＋y＋5)(χ＋y－2)",ans:"χ²＋2χy＋y²＋3χ＋3y－10",
    steps:[
      {cls:"y",lbl:"確認",txt:"「χ＋y」が同じカタマリ → A＝χ＋y"},
      {cls:"b",lbl:"公式①",txt:"(A＋5)(A－2)＝A²＋3A－10"},
      {cls:"g",lbl:"戻す",txt:"(χ＋y)²＋3(χ＋y)－10＝χ²＋2χy＋y²＋3χ＋3y－10"},
    ]},
  {q:"(χ－y＋3)²",ans:"χ²－2χy＋y²＋6χ－6y＋9",
    steps:[
      {cls:"y",lbl:"確認",txt:"「χ－y」を A とおく → (A＋3)²"},
      {cls:"b",lbl:"公式②",txt:"A²＋6A＋9"},
      {cls:"g",lbl:"戻す",txt:"(χ－y)²＋6(χ－y)＋9＝χ²－2χy＋y²＋6χ－6y＋9"},
    ]},
  {q:"(a＋b＋2)(a＋b－2)",ans:"a²＋2ab＋b²－4",
    steps:[
      {cls:"y",lbl:"確認",txt:"「a＋b」が同じカタマリ → A＝a＋b"},
      {cls:"b",lbl:"公式③",txt:"(A＋2)(A－2)＝A²－4"},
      {cls:"g",lbl:"戻す",txt:"(a＋b)²－4＝a²＋2ab＋b²－4"},
    ]},
];
function build(){
  const area=document.getElementById('drill-area');area.innerHTML='';
  DRILLS.forEach(function(p,i){
    area.innerHTML+='<div class="problem-card" id="dc'+i+'">'
      +'<div class="problem-head"><span class="p-badge">演習'+(i+1)+'</span>'+p.q
      +'<button class="ans-toggle" onclick="tog('+i+')">答を見る</button></div>'
      +'<div id="de'+i+'" style="display:none;padding:0 13px 12px;"></div></div>';
  });
}
function tog(i){
  const p=DRILLS[i];const d=document.getElementById('de'+i);const btn=document.querySelector('#dc'+i+' .ans-toggle');
  if(d.style.display==='block'){d.style.display='none';btn.textContent='答を見る';return;}
  let h='<div style="background:var(--primary-light);border:2px solid var(--primary);border-radius:8px;padding:7px 11px;margin-bottom:7px;font-weight:700;color:var(--primary);">正解：<strong>'+p.ans+'</strong></div>';
  p.steps.forEach(function(s){h+='<div class="calc-row '+s.cls+'"><span class="clbl '+s.cls+'">'+s.lbl+'</span><div>'+s.txt+'</div></div>';});
  d.innerHTML=h;d.style.display='block';btn.textContent='答を隠す';
}
build();
</script>
</body>
</html>
