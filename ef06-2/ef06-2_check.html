.step-item.active .step-circle{background:var(--primary);color:#fff;box-shadow:0 0 0 2px var(--primary-light);}
.step-item:not(.active) .step-circle{background:#94a3b8;color:#fff;}
.step-arrow{color:#cbd5e1;font-size:.9em;padding:0;}
.instruction{background:var(--primary-light);border-left:4px solid var(--primary);border-radius:0 var(--radius) var(--radius) 0;padding:12px 15px;margin-bottom:18px;font-size:.93em;color:#1e40af;line-height:1.7;}
.q-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:14px;padding:16px;}
.q-num{font-size:.82em;font-weight:700;color:var(--primary);margin-bottom:9px;}
.q-text{font-size:1.05em;font-weight:700;margin-bottom:13px;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.choice-btn{background:#f1f5f9;border:2px solid var(--border);border-radius:10px;padding:11px 8px;font-family:'BIZ UDPGothic',sans-serif;font-size:.88em;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;}
.choice-btn.correct{background:var(--success-light);border-color:var(--success);color:#15803d;}
.choice-btn.wrong{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
.choice-btn.show-ans{background:var(--success-light);border-color:var(--success);color:#15803d;}
.result-panel{margin-top:13px;padding:10px 14px;border-radius:9px;font-size:.9em;font-weight:700;display:none;}
.result-panel.ok{background:var(--success-light);border:1.5px solid var(--success);color:#15803d;}
.result-panel.ng{background:var(--accent-light);border:1.5px solid var(--accent);color:var(--accent);}
.score-box{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-radius:var(--radius);padding:20px;text-align:center;margin-top:22px;display:none;}
.score-box .sc{font-size:2.2em;font-weight:700;margin-bottom:5px;}
.nav-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:26px;}
.btn-nav{font-family:'BIZ UDPGothic','BIZ UDP Gothic',sans-serif;font-size:.93em;font-weight:700;padding:11px 24px;border-radius:50px;border:none;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s;}
.btn-nav:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn-f{background:var(--primary);color:#fff;}
.btn-b{background:#f1f5f9;color:var(--text-sub);}
.btn-h{background:#dbeafe;color:#1e40af;font-size:.83em;padding:9px 18px;}
.btn-retry{background:#fff;color:#2563eb;margin-top:14px;width:100%;font-family:'BIZ UDPGothic',sans-serif;font-size:.93em;font-weight:700;padding:12px;border-radius:50px;border:none;cursor:pointer;touch-action:manipulation;}
</style>

<script>
// intro：χ²－5χ＋4, χ²－7χ＋12
// example：χ²－9χ＋20, χ²－11χ＋24, χ²－13χ＋30, χ²－15χ＋56
// drill：χ²－8χ＋15, χ²－6χ＋8, χ²－10χ＋21 など
// check(以下)：重複なし
const QS=[
  {q:"χ²－5χ＋6 を因数分解すると？",
    choices:["(χ－2)(χ－3)","(χ＋2)(χ＋3)","(χ－1)(χ－6)","(χ－3)(χ＋2)"],
    ans:0,exp:"かけて6，たして－5 → －2と－3"},
  {q:"χ²－9χ＋18 を因数分解すると？",
    choices:["(χ＋3)(χ＋6)","(χ－2)(χ－9)","(χ－3)(χ－6)","(χ－3)(χ＋6)"],
    ans:2,exp:"かけて18，たして－9 → －3と－6"},
  {q:"χ²－10χ＋25 を因数分解すると？",
    choices:["(χ－5)²","(χ＋5)²","(χ－2)(χ－13)","(χ－1)(χ－25)"],
    ans:0,exp:"かけて25，たして－10 → －5と－5 → (χ－5)²"},
  {q:"χ²－14χ＋45 を因数分解すると？",
    choices:["(χ－6)(χ－8)","(χ－3)(χ－15)","(χ－7)(χ－7)","(χ－5)(χ－9)"],
    ans:3,exp:"かけて45，たして－14 → －5と－9"},
  {q:"χ²－16χ＋48 を因数分解すると？",
    choices:["(χ－4)(χ－12)","(χ－6)(χ－8)","(χ－3)(χ－16)","(χ－8)²"],
    ans:1,exp:"かけて48，たして－16 → －6と－8"},
];
let answers=[],answered=new Array(QS.length).fill(false);
function buildQuiz(){
  const area=document.getElementById('quiz-area');area.innerHTML='';
  QS.forEach(function(q,i){
    let cHtml=q.choices.map(function(c,j){return '<button class="choice-btn" id="c'+i+'_'+j+'" onclick="choose('+i+','+j+')">'+c+'</button>';}).join('');
    area.innerHTML+='<div class="q-card" id="qc'+i+'"><div class="q-num">問'+(i+1)+'</div><div class="q-text">'+q.q+'</div><div class="choices">'+cHtml+'</div><div class="result-panel" id="rp'+i+'"></div></div>';
  });
}
function choose(qi,ci){
  if(answered[qi])return;answered[qi]=true;answers[qi]=ci;
  const q=QS[qi];const correct=ci===q.ans;
  for(let j=0;j<q.choices.length;j++){const btn=document.getElementById('c'+qi+'_'+j);btn.disabled=true;if(j===q.ans)btn.classList.add('show-ans');}
  document.getElementById('c'+qi+'_'+ci).classList.add(correct?'correct':'wrong');
  const rp=document.getElementById('rp'+qi);rp.style.display='block';rp.className='result-panel '+(correct?'ok':'ng');
  rp.innerHTML=(correct?'✅ 正解！':'❌ 不正解…　正解は【'+q.choices[q.ans]+'】')+'<br><span style="font-weight:400;">'+q.exp+'</span>';
  if(answered.every(function(v){return v;}))showScore();
}
function showScore(){
  const box=document.getElementById('score-box');
  const correct=answers.filter(function(a,i){return a===QS[i].ans;}).length;
  box.style.display='block';
  document.getElementById('sc-text').textContent=correct+' / '+QS.length+' 問正解';
  const msgs=['もう一度チャレンジ！💪','あと少し！📖','なかなか良い！✨','ほぼ完璧！🌟','満点！すばらしい🎉'];
  document.getElementById('sc-msg').textContent=msgs[Math.min(correct,4)];
  if(correct===QS.length){
    setTimeout(function(){
      try{
        if(typeof markPassed==='function') markPassed('EF06-2');
        else if(window.markPassed) window.markPassed('EF06-2');
      }catch(e){console.warn('markPassed error:',e);}
    },100);
    if(typeof launchConfetti==='function') launchConfetti();
  }
}
function retry(){answered=new Array(QS.length).fill(false);answers=[];document.getElementById('score-box').style.display='none';buildQuiz();}
buildQuiz();
</script>
